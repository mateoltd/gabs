<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Module development</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <h1 id="title">Module development</h1>
      <p>
        Isolated fixtures and simulated authorization. Source changes reload
        this view and reset simulation data.
      </p>
      <section>
        <h2>Environment</h2>
        <label
          ><input type="checkbox" id="online" checked /> Server online</label
        ><button id="sync">Synchronize pending work</button>
        <details>
          <summary>Permission simulator</summary>
          <div id="permissions"></div>
        </details>
      </section>
      <section>
        <h2>Resources and operations</h2>
        <label
          >Contract
          <select id="contract"></select
        ></label>
        <p id="policy"></p>
        <form id="form">
          <div id="fields"></div>
          <button type="submit">Submit</button>
        </form>
        <p id="feedback" role="status"></p>
      </section>
      <section>
        <h2>Accepted records</h2>
        <div id="records"></div>
      </section>
      <section>
        <h2>Operation journal</h2>
        <div id="journal"></div>
      </section>
      <section>
        <h2>Emitted events</h2>
        <pre id="events"></pre>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
