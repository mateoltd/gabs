server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
 client_max_body_size 256k;
 location /api/ { proxy_pass http://api:4310; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
 location /auth/ { proxy_pass http://api:4310; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
 location /assets/ { expires 1y; try_files $uri =404; }
 location = /sw.js { add_header Cache-Control "no-cache"; }
 location = /index.html { add_header Cache-Control "no-cache"; }
 location / { try_files $uri $uri/ /index.html; }
}
