packages:
  - apps/*
  - packages/*
  - packages/ui/*
  - composition
  - modules/*
allowBuilds:
  # Node-API prebuilds are bundled; no dependency build script is required.
  better-sqlite3-multiple-ciphers: false
  electron: true
  esbuild: true
  electron-winstaller: true
  fs-xattr: true
  macos-alias: true
minimumReleaseAgeExclude:
  - "@aws-sdk/client-s3@3.1132.0"
  - "@turbo/darwin-64@2.10.13"
  - "@turbo/darwin-arm64@2.10.13"
  - "@turbo/linux-64@2.10.13"
  - "@turbo/linux-arm64@2.10.13"
  - "@turbo/windows-64@2.10.13"
  - "@turbo/windows-arm64@2.10.13"
  - lucide-react@1.46.0
  - turbo@2.10.13
overrides:
  "@electron/node-gyp": 10.2.0-electron.2
patchedDependencies:
  better-sqlite3-multiple-ciphers@13.0.3: patches/better-sqlite3-multiple-ciphers@13.0.3.patch
# Forge is bundled; only its packaging tools need public hoisting.
publicHoistPattern:
  - "@electron-forge/*"
