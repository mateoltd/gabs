services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: suite
      POSTGRES_PASSWORD: postgres_local
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - suite_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d suite"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  suite_postgres:
