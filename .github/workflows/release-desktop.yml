name: Signed desktop candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    environment: desktop-release
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      API_ORIGIN: ${{ vars.API_ORIGIN }}
      AUTH0_ISSUER: ${{ vars.AUTH0_ISSUER }}
      AUTH0_DESKTOP_CLIENT_ID: ${{ vars.AUTH0_DESKTOP_CLIENT_ID }}
      AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE }}
      AUTH0_DESKTOP_CALLBACK: http://127.0.0.1:49173/callback
      DESKTOP_UPDATE_URL: ${{ vars.DESKTOP_UPDATE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - run: pnpm install --frozen-lockfile
      - name: Validate public release configuration
        run: node tooling/validate-release.mjs
      - name: Install signing credentials
        shell: bash
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
        run: node tooling/prepare-signing.mjs
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg
      - run: pnpm --filter @suite/desktop make
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: signed-candidate-${{ matrix.os }}
          path: apps/desktop/out/make
